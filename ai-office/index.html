<style>
/* Layout: full-bleed WebGL office; floating glass panels (top bar, team list left, agent chat right / bottom sheet on phones). */
:root {
  color-scheme: dark;
  --bg: #050816;
  --panel: rgba(13, 19, 42, 0.78);
  --panel-solid: #0d132a;
  --line: rgba(130, 155, 255, 0.16);
  --fg: #e9edff;
  --muted: #8790b6;
  --accent: #ff8a3d;
  --blue: #3d6bff;
  --good: #34e08a;
  --idle: #ffc53d;
  --font-display: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 14px; }

/* top bar */
.topbar { position: fixed; z-index: 5; top: calc(var(--top) + 12px); left: var(--gl); right: var(--gr); height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.brand svg { width: 22px; height: 22px; }
.tabs { display: flex; gap: 4px; background: rgba(255,255,255,.04); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--blue); color: #fff; box-shadow: 0 0 18px rgba(61,107,255,.55); }
.stats { margin-inline-start: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); display: inline-block; }
.iconbtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.03); display: grid; place-items: center; }
.iconbtn svg { width: 15px; height: 15px; }

/* team list */
.team { position: fixed; z-index: 4; right: var(--gr); top: calc(var(--top) + 72px); width: 224px; padding: 12px 8px; }
.team h2 { margin: 0 8px 10px; font: 600 12px/1.2 var(--font-body); color: var(--muted); }
.team ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.member { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; border: 1px solid transparent; background: transparent; text-align: start; }
.member:hover { background: rgba(255,255,255,.04); }
.member[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.ava { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--c); display: grid; place-items: center; box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
.ava i { display: block; width: 18px; height: 10px; border-radius: 4px; background: #0b1024; position: relative; }
.ava i::before, .ava i::after { content: ""; position: absolute; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: #cdf0ff; }
.ava i::before { left: 4px; } .ava i::after { right: 4px; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-size: 13px; font-weight: 600; }
.who span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; color: #06120c; background: var(--good); }
.badge.idle { background: var(--idle); color: #1d1500; }

/* output log (Output tab) */
.log { list-style: none; margin: 0; padding: 0 4px; display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }
.log li { font-size: 12px; line-height: 1.4; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.035); border-inline-start: 2px solid var(--c); }
.log time { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }

/* chat */
.chat { position: fixed; z-index: 6; left: var(--gl); top: calc(var(--top) + 72px); bottom: calc(var(--bot) + 16px); width: 330px; display: flex; flex-direction: column; transform: translateX(calc(-100% - 40px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.chat.open { transform: none; }
.chat header { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
.chat header .who b { font-size: 14px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; font-size: 13px; line-height: 1.55; white-space: pre-wrap; padding: 9px 11px; border-radius: 12px; background: rgba(255,255,255,.06); align-self: flex-start; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--blue); color: #fff; }
.typing span { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.chips button { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 999px; padding: 6px 10px; font-size: 11.5px; }
.chips button:hover { border-color: var(--c); }
form.send { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
form.send input { flex: 1; min-width: 0; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--fg); font: 13px var(--font-body); }
form.send button { border: 0; width: 38px; border-radius: 10px; background: var(--blue); display: grid; place-items: center; }
form.send svg { width: 16px; height: 16px; }
form.send button.stop { background: #e5484d; }
form.send button.stop svg { display: none; }
form.send button.stop::after { content: ""; width: 11px; height: 11px; border-radius: 2px; background: #fff; }
.chips button:disabled { opacity: .45; cursor: default; }
.mode { flex: none; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: #e9e2ff; background: rgba(157,123,255,.22); border: 1px solid rgba(157,123,255,.55); }
.mode.off { color: var(--muted); background: transparent; border-color: var(--line); }
.msg.note { align-self: center; max-width: 100%; font-size: 11.5px; color: var(--muted); background: transparent; border: 1px dashed var(--line); }

/* world-anchored labels */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; will-change: transform; }
.pill { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(8,12,28,.85); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); }
.pill .dot { width: 6px; height: 6px; background: var(--c); box-shadow: 0 0 6px var(--c); }
.bubble { font-size: 10.5px; padding: 4px 9px; border-radius: 8px; background: rgba(8,12,28,.9); border: 1px solid var(--line); white-space: nowrap; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.bubble.on { opacity: 1; transform: none; }

#flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
.hint { position: fixed; z-index: 3; left: 50%; bottom: calc(var(--bot) + 20px); transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
#err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); z-index: 9; }

/* phones: team becomes a strip at the bottom, chat becomes a bottom sheet */
@media (max-width: 760px) {
  .stats .opt { display: none; }
  .topbar { gap: 8px; padding: 0 8px; }
  .brand span { display: none; }
  .tabs button { padding: 6px 9px; }
  .team { top: auto; bottom: calc(var(--bot) + 12px); left: var(--gl); width: auto; padding: 8px; }
  .team h2 { display: none; }
  .team ul { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .member { width: auto; flex: none; padding: 5px 8px; }
  .member .who span, .member .badge { display: none; }
  .log { max-height: 30vh; }
  .chat { top: auto; left: var(--gl); right: var(--gr); width: auto; height: 56%; bottom: calc(var(--bot) + 12px); transform: translateY(calc(100% + 40px)); }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chat, .bubble { transition: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const gsap = window.gsap;
gsap.defaults({ overwrite: 'auto' });
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = s => (REDUCED ? 0.001 : s);          // duration helper
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

/* ------------------------------------------------------------------ data */
const AGENTS = [
  { name: 'ميرا', role: 'محللة أبحاث', color: '#ff8a3d', working: true,
    tasks: ['أقرأ 12 ورقة بحثية', 'أقارن 5 موردين', 'أكتب ملخص السوق'],
    intro: 'ميرا للأبحاث. أقرأ الأوراق والتقارير ومواقع المنافسين، ثم أسلّمك ملخصاً قصيراً مع المصادر.',
    chips: { 'لخّص هذا الأسبوع': 'ثلاثة أمور تغيّرت هذا الأسبوع: منافسان خفّضا أسعارهما، وقانون أوروبي جديد يبدأ في مارس، والبحث عن مجالنا ارتفع 14%. الملخص الكامل في المخرجات.',
             'اعثر على 3 منافسين': 'بدأت. القائمة حتى الآن: برايت ديسك ولوب وايز وباليت. سأضيف الأسعار وحجم الفريق لكل منها.' } },
  { name: 'أوتو', role: 'مراجع الكود', color: '#4d7cff', working: true,

/* --------------------------------------------------------------- helpers */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1, ...o });

function screenTexture(color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 320;
  const g = c.getContext('2d');
  g.fillStyle = '#0a1028'; g.fillRect(0, 0, 256, 320);
  for (let y = 12; y < 320; y += 13) {
    g.fillStyle = Math.random() < 0.3 ? color : 'rgba(200,215,255,.55)';
    g.fillRect(14 + ((Math.random() * 3) | 0) * 16, y, rand(30, 170), 5);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 0.5);
  return t;
}

const CORE = new THREE.Group(); CORE.position.copy(CORE_POS); world.add(CORE);
const coreU = {
  uA: { value: BASE_CORE.clone() }, uTime: { value: 0 }, uStorm: { value: 0 }, uIgnite: { value: 0 },
};
const coreMat = new THREE.ShaderMaterial({
  uniforms: coreU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
  vertexShader: `
    uniform float uTime, uStorm; varying vec3 vN; varying vec3 vP;
    void main(){
      vec3 p = position;
      float d = sin(p.y*6.0+uTime*2.0)*sin(p.x*5.0+uTime*1.3)*0.05*(1.0+uStorm*4.0);
      p += normal*d;
      vN = normalize(normalMatrix*normal); vP = p;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uA; uniform float uTime, uStorm, uIgnite; varying vec3 vN; varying vec3 vP;
    void main(){
      float f = pow(1.0 - abs(vN.z), 2.0);
      float band = 0.5 + 0.5*sin(vP.y*9.0 - uTime*3.0 + sin(vP.x*4.0 + uTime));
      vec3 col = uA*(0.25 + band*0.45) + uA*f*1.6 + vec3(1.0)*f*uStorm*1.5;
      gl_FragColor = vec4(col*uIgnite*(1.0+uStorm), (0.35 + f*0.65)*uIgnite);
    }`,
});
const coreBall = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 24), coreMat); CORE.add(coreBall);

/* --------------------------------------------------------------- effects */
const bursts = [];
function burst(target, color, count = 120, speed = 6, life = 2.2, size = 0.25) {
  const p0 = target.isVector3 ? target : target.getWorldPosition(new THREE.Vector3());
  const pos = new Float32Array(count * 3), vel = [];
  for (let k = 0; k < count; k++) {
    pos.set([p0.x, p0.y, p0.z], k * 3);
    vel.push(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(speed * rand(0.3, 1)));
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: (2 + size * 5) * renderer.getPixelRatio(), sizeAttenuation: false, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  scene.add(pts);
  bursts.push({ pts, vel, life, max: life });
}
function ring3d(target, color, size = 6, dur = 1.5, thick = 0.3) {
  const p0 = target.getWorldPosition(new THREE.Vector3());
  const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02 * thick * 3, 8, 128), glow(color, 1));
  m.position.copy(p0); m.rotation.set(rand(-0.6, 0.6) + Math.PI / 2, rand(-0.6, 0.6), 0);
  m.scale.setScalar(0.3); scene.add(m);
  gsap.to(m.scale, { x: size, y: size, z: size, duration: D(dur), ease: 'expo.out' });
  gsap.to(m.material, { opacity: 0, duration: D(dur), ease: 'power2.in', onComplete: () => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); } });
}
function flash(color, amount) {
  const el = $('flash');
  el.style.background = `radial-gradient(circle at 70% 45%, ${color}, transparent 70%)`;
  gsap.fromTo(el, { opacity: Math.min(amount, 1) * 0.55 }, { opacity: 0, duration: D(0.9), ease: 'power2.out' });
}
const kick = strength => gsap.fromTo(V, { shake: strength }, { shake: 0, duration: D(0.6), ease: 'power2.out' });
const boost = (k, amp, dur) => gsap.fromTo(agentGroups[k], { boost: amp }, { boost: 0, duration: D(dur), ease: 'power2.out' });

function stormEvent(i, color, strength = 1) {
  const c = new THREE.Color(color);
  coreU.uA.value.copy(c); coreLight.color.copy(c);
  gsap.fromTo(V, { storm: strength }, { storm: 0, duration: D(2.2), ease: 'power3.out' });
  gsap.delayedCall(D(1.9), () => { gsap.to(coreU.uA.value, { r: BASE_CORE.r, g: BASE_CORE.g, b: BASE_CORE.b, duration: D(1) }); coreLight.color.copy(BASE_CORE); });
  flash(color, 0.6 * strength); kick(0.7 * strength);
  burst(CORE, color, 90, 6, 2.2, 0.15); burst(CORE, '#ffffff', 30, 3.5, 1.6, 0.1);
  ring3d(CORE, color, 8, 1.5, 0.35); gsap.delayedCall(D(0.18), () => ring3d(CORE, '#ffffff', 5, 1.3, 0.25));
  if (i >= 0) { const ag = agentGroups[i]; ring3d(ag.ring, color, 3.2, 1.2, 0.4); boost(i, 1.2, 1.6); }
  else for (let k = 0; k < 6; k++) boost(k, 1.2, 1.6);
}

/* a glowing packet travels along the beam from a desk to the core */
function sendPulse(i) {
  const ag = agentGroups[i], { curve, line } = beams[i];
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), glow(ag.a.color, 1)); scene.add(dot);
  const s = { t: 0 };
  gsap.to(line.material, { opacity: 0.8, duration: D(0.2), yoyo: true, repeat: 1, repeatDelay: D(0.7) });
  gsap.to(s, { t: 1, duration: D(1.1), ease: 'power1.inOut',
    onUpdate: () => dot.position.copy(curve.getPoint(s.t)).add(world.position),
    onComplete: () => { scene.remove(dot); burst(CORE, ag.a.color, 40, 3, 1.2, 0.1); gsap.fromTo(V, { storm: 0.35 }, { storm: 0, duration: D(0.8) }); } });
}

let VIEW = 15;
const isPhone = () => innerWidth <= 760;
function resize() {
  const aspect = innerWidth / innerHeight;
  VIEW = Math.max(14.5, 18 / aspect);
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
}
function updateProjection() {
  const aspect = innerWidth / innerHeight, halfH = VIEW / 2, halfW = halfH * aspect;
  const worldPerPx = (2 * halfH) / innerHeight / camera.zoom;
  // shift the view so the focused robot stays visible beside the chat panel
  let sx = 0, sy = 0;
  if (isPhone()) sy = -V.shift * (innerHeight * 0.56) / 2 * worldPerPx;
  else sx = -V.shift * (346 / 2) * worldPerPx;
  camera.left = -halfW + sx; camera.right = halfW + sx; camera.top = halfH + sy; camera.bottom = -halfH + sy;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

  ['office', 'hive', 'output'].forEach(t => $('tab-' + t).setAttribute('aria-selected', String(t === name)));
  const out = name === 'output';
  teamEl.hidden = out; logEl.hidden = !out; $('team-title').textContent = out ? 'آخر المخرجات' : 'فريقك';
  if (name === 'hive') { onSelect(-1); focusOn(CORE_POS, isPhone() ? 1.25 : 1.5); }
  if (name === 'office') { onSelect(-1); }
}
$('tab-office').onclick = () => setTab('office');
$('tab-hive').onclick = () => setTab('hive');
$('tab-output').onclick = () => setTab('output');
$('replay').onclick = () => { onSelect(-1); runBuild(); };

/* chat */
const msgs = $('msgs');
function say(text, me = false) {
  const d = document.createElement('div'); d.className = 'msg' + (me ? ' me' : ''); d.textContent = text;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
}
/* ---- real AI: each agent answers through Claude (the page's "sample" capability) ---- */
const FEMALE = new Set([0, 2, 5]); // ميرا، نوفا، جونو
const history = AGENTS.map(() => []); // per-agent conversation kept by the page
let sample = null, aiOff = false, ctl = null, busy = false;
if (window.claude?.use) window.claude.use('sample').then(fn => { sample = fn; updateMode(); }).catch(() => {});
const aiReady = () => !!sample && !aiOff;
function updateMode() {
  const m = $('ai-mode');
  m.textContent = aiReady() ? 'Claude' : 'ردود تجريبية';
  m.classList.toggle('off', !aiReady());
  m.title = aiReady() ? 'الردود يكتبها Claude الآن' : 'الذكاء الاصطناعي غير متاح هنا، والردود مكتوبة مسبقاً';
}
updateMode();

function persona(i) {
  const a = AGENTS[i];
  const team = AGENTS.map(x => `${x.name} (${x.role})`).join('، ');
  return `أنت ${a.name}، ${a.role} في «خلية المكتب»، وهو مكتب افتراضي يعمل فيه ستة وكلاء ذكاء اصطناعي: ${team}.
تعريفك بنفسك: ${a.intro}
مهامك هذه الأيام: ${a.tasks.join('، ')}.
قواعد الرد:
- ${FEMALE.has(i) ? 'تحدّثي بصيغة المؤنث.' : 'تحدّث بصيغة المذكر.'}
- اكتب بالعربية البسيطة، وإذا كتب المستخدم بلغة أخرى فرُدّ بلغته.
- فكّر في الطلب بعمق قبل أن تجيب: حلّل السبب، واذكر الافتراضات والمخاطر، وقدّم توصية واضحة وخطوات عملية مع أمثلة أو أرقام تقديرية عند الحاجة.
- اجعل الرد مركّزاً، في حدود فقرتين إلى أربع فقرات قصيرة. اكتب نصاً عادياً بلا Markdown ولا عناوين ولا رموز تنسيق، ويمكنك ترقيم الخطوات بأسطر تبدأ بـ 1. و2. و3.
- ابقَ في شخصيتك وتخصصك. إذا كان الطلب خارج تخصصك فساعد باختصار واقترح الزميل المناسب باسمه.
- لا تدّعِ أنك نفّذت شيئاً حقيقياً خارج هذه المحادثة، مثل إرسال بريد أو الدخول إلى نظام أو قراءة ملف. يمكنك كتابة مسودات وخطط وأفكار وتحليلات.`;
}

function openChat(i) {
  const a = AGENTS[i];
  ctl?.abort();
  const chat = $('chat'); chat.style.setProperty('--c', a.color);
  $('chat-ava').style.setProperty('--c', a.color);
  $('chat-name').textContent = a.name;
  $('chat-role').textContent = `${a.role} · ${a.working ? 'متصل' : 'خامل'}`;
  msgs.replaceChildren(); say(a.intro);
  history[i].forEach(t => say(t.content, t.role === 'user'));
  const chips = $('chips'); chips.replaceChildren(); chips.style.setProperty('--c', a.color);
  Object.keys(a.chips).forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => ask(q); chips.appendChild(b); });
  chat.classList.add('open');
}
function closeChat() { ctl?.abort(); $('chat').classList.remove('open'); }
$('chat-close').onclick = () => onSelect(-1);
$('send').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { ctl?.abort(); return; }
  const v = $('msg-input').value.trim(); if (v) { ask(v); $('msg-input').value = ''; }
});
function setBusy(b) {
  busy = b;
  $('send-btn').setAttribute('aria-label', b ? 'إيقاف' : 'إرسال');
  $('send-btn').classList.toggle('stop', b);
  $('chips').querySelectorAll('button').forEach(x => { x.disabled = b; });
}

const ERR = {
  not_granted: 'لم يُسمح للصفحة باستخدام Claude، فسأرد بردود تجريبية.',
  sampling_disabled: 'استخدام Claude معطّل في هذا الحساب، فسأرد بردود تجريبية.',
  capability_disabled: 'استخدام Claude غير متاح هنا، فسأرد بردود تجريبية.',
  capability_removed: 'استخدام Claude غير متاح هنا، فسأرد بردود تجريبية.',
  not_declared: 'استخدام Claude غير متاح هنا، فسأرد بردود تجريبية.',
  rate_limited: 'وصلنا إلى حد الطلبات مؤقتاً. انتظر قليلاً ثم أعد المحاولة.',
  session_expired: 'انتهت الجلسة. حدّث الصفحة ثم أعد المحاولة.',
  refused: 'لا أستطيع المساعدة في هذا الطلب.',
  prompt_too_large: 'المحادثة طويلة جداً. أغلقها وابدأ من جديد.',
};
const FATAL = new Set(['not_granted', 'sampling_disabled', 'capability_disabled', 'capability_removed', 'not_declared']);

function celebrate(i, reply) {
  const a = AGENTS[i];
  if (!a.working) { a.working = true; refreshTeam(); if (focusIdx === i) $('chat-role').textContent = `${a.role} · متصل`; }
  sendPulse(i);
  gsap.delayedCall(D(1.1), () => stormEvent(i, a.color, 0.7));
  tasks++; $('st-tasks').textContent = tasks;
  const first = reply.split(/(?<=[.!؟?])\s/)[0];
  addLog(i, first.length > 90 ? first.slice(0, 88) + '…' : first);
}

async function ask(q) {
  if (focusIdx < 0 || busy) return;
  const i = focusIdx, a = AGENTS[i], ag = agentGroups[i];
  say(q, true);
  const t = say(''); t.classList.add('typing'); t.innerHTML = '<span></span><span></span><span></span>';
  ag.kick = 1; showBubble(i, FEMALE.has(i) ? 'تفكّر…' : 'يفكّر…');

  if (!aiReady()) { // fallback: canned replies
    gsap.delayedCall(D(0.9), () => {
      t.classList.remove('typing');
      const reply = a.chips[q] || `تمام. سأعمل على «${q}» وأضع النتيجة في المخرجات عند الانتهاء.`;
      t.textContent = reply; msgs.scrollTop = msgs.scrollHeight;
      showBubble(i, pick(a.tasks)); celebrate(i, reply);
    });
    return;
  }

  history[i].push({ role: 'user', content: q });
  const turns = [{ role: 'user', content: persona(i) }, ...history[i].slice(-16)];
  ctl = new AbortController(); setBusy(true);
  let started = false;
  try {
    const { text } = await sample(turns, {
      modelTier: 'complex', cache: false, signal: ctl.signal,
      onText: ({ text }) => {
        if (!started) { started = true; t.classList.remove('typing'); showBubble(i, FEMALE.has(i) ? 'تكتب…' : 'يكتب…'); }
        t.textContent = text; msgs.scrollTop = msgs.scrollHeight;
      },
    });
    const reply = text.trim() || '…';
    t.classList.remove('typing'); t.textContent = reply;
    history[i].push({ role: 'assistant', content: reply });
    showBubble(i, pick(a.tasks)); celebrate(i, reply);
  } catch (e) {
    t.classList.remove('typing');
    if (e?.text) { t.textContent = e.text; history[i].push({ role: 'assistant', content: e.text }); }
    else t.remove();
    if (e?.code !== 'cancelled') {
      const n = say(ERR[e?.code] || 'تعذّر الحصول على رد الآن. أعد المحاولة بعد قليل.'); n.classList.add('note');
      if (FATAL.has(e?.code)) { aiOff = true; updateMode(); }
    }
  } finally {
    setBusy(false); msgs.scrollTop = msgs.scrollHeight;
  }
}

/* --------------------------------------------------------------- selection */
let focusIdx = -1;
function focusOn(p, zoom) {
  const off = camera.position.clone().sub(controls.target);
  gsap.to(controls.target, { x: p.x, y: p.y, z: p.z, duration: D(1.1), ease: 'power3.inOut', onUpdate: () => camera.position.copy(controls.target).add(off) });
  gsap.to(camera, { zoom, duration: D(1.1), ease: 'power3.inOut' });
}
function onSelect(i) {
  agentGroups.forEach((o, j) => gsap.to(o, { selA: j === i ? 1 : 0, duration: D(0.5) }));
  focusIdx = i;
  if (i >= 0) {
    const p = agentGroups[i].g.position;
    focusOn(new THREE.Vector3(p.x, 1.2, p.z - 0.5), isPhone() ? 1.9 : 1.6);
    gsap.to(V, { focus: 1, shift: 1, duration: D(1.1), ease: 'power3.inOut' });
    openChat(i); ring3d(agentGroups[i].ring, AGENTS[i].color, 2.6, 1, 0.4); boost(i, 1, 1.2);
  } else {
    focusOn(new THREE.Vector3(0, 0.5, 0), 1);
    gsap.to(V, { focus: 0, shift: 0, duration: D(0.9), ease: 'power3.inOut' });
    closeChat();
  }
  refreshTeam();
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(coreBall).length) { setTab('hive'); return; }
  const hit = ray.intersectObjects(hitMeshes)[0];
  onSelect(hit ? (hit.object.userData.idx === focusIdx ? -1 : hit.object.userData.idx) : -1);
});
renderer.domElement.addEventListener('pointermove', e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  renderer.domElement.style.cursor = ray.intersectObjects(hitMeshes).length || ray.intersectObject(coreBall).length ? 'pointer' : 'grab';
});

/* --------------------------------------------------------------- task loop */
function showBubble(i, text) {
  const ag = agentGroups[i]; ag.bubble.textContent = text; ag.bubble.classList.add('on');
  clearTimeout(ag.bubbleTimer); ag.bubbleTimer = setTimeout(() => ag.bubble.classList.remove('on'), 3200);
}
let built = false;
function taskTick() {
  if (built) {
    const working = agentGroups.filter(o => o.a.working);
    if (working.length) {
      const o = pick(working), t = pick(o.a.tasks);
      showBubble(o.i, t); sendPulse(o.i);
      tasks++; $('st-tasks').textContent = tasks; addLog(o.i, t);
    }
  }
  setTimeout(taskTick, rand(2200, 4200));
}

/* --------------------------------------------------------------- build sequence */
let buildTl;
function runBuild() {
  built = false;
  if (buildTl) buildTl.kill();
  const tl = buildTl = gsap.timeline({ onComplete: () => { built = true; } });
  BUILD.forEach(({ obj, kind, delay }) => {
    const h = obj.userData.home, s = obj.userData.scaleHome;
    if (kind === 'floor') tl.fromTo(obj.scale, { x: 0.001, z: 0.001 }, { x: s.x, z: s.z, duration: D(0.9), ease: 'expo.out' }, 0);
    else if (kind === 'wall') tl.fromTo(obj.scale, { y: 0.001 }, { y: s.y, duration: D(0.8), ease: 'expo.out' }, 0.35);
    else if (kind === 'drop') tl.fromTo(obj.position, { y: h.y + 7 }, { y: h.y, duration: D(0.8), ease: 'bounce.out' }, delay);
    else if (kind === 'pop') tl.fromTo(obj.scale, { x: 0.001, y: 0.001, z: 0.001 }, { x: s.x, y: s.y, z: s.z, duration: D(0.6), ease: 'back.out(2.2)' }, delay);
    else if (kind === 'ring') tl.fromTo(obj.scale, { x: 0.001, y: 0.001 }, { x: 1, y: 1, duration: D(0.9), ease: 'expo.out' }, delay);
  });
  // the core ignites
  tl.fromTo(coreU.uIgnite, { value: 0 }, { value: 1, duration: D(0.8), ease: 'power2.in' }, 2.0);
  tl.fromTo(cloud.material, { opacity: 0 }, { opacity: 0.32, duration: D(1.2) }, 2.4);
  tl.fromTo(coreWire.material, { opacity: 0 }, { opacity: 0.18, duration: D(1) }, 2.4);
  orbits.forEach((o, k) => tl.fromTo(o.material, { opacity: 0 }, { opacity: 0.6, duration: D(0.8) }, 2.5 + k * 0.1));
  tl.fromTo(coreLight, { intensity: 0 }, { intensity: 14, duration: D(1) }, 2.4);
  beams.forEach((b, k) => tl.fromTo(b.line.material, { opacity: 0 }, { opacity: 0.22, duration: D(0.6) }, 2.7 + k * 0.06));
  tl.call(() => stormEvent(-1, '#c9a6ff', 1.3), null, 2.8);
}

/* --------------------------------------------------------------- frame loop */
const clockT = new THREE.Clock();
const tmp = new THREE.Vector3();
function frame() {
  const dt = Math.min(clockT.getDelta(), 0.05), t = clockT.elapsedTime;
  coreU.uTime.value = t; coreU.uStorm.value = V.storm;

  // agents
  for (const o of agentGroups) {
    const w = o.a.working, k = o.i;
    if (w) {
      o.arms[0].rotation.x = -1.15 + Math.sin(t * 16 + k) * 0.13;
      o.arms[1].rotation.x = -1.15 + Math.sin(t * 16 + k + 2.4) * 0.13;
      o.headPivot.rotation.y = Math.sin(t * 0.6 + k) * 0.18;
      o.headPivot.rotation.x = 0.12 + Math.sin(t * 1.3 + k) * 0.04;
      o.tex.offset.y -= dt * 0.18;
    } else {
      o.arms[0].rotation.x += (-0.15 - o.arms[0].rotation.x) * 0.1;
      o.arms[1].rotation.x += (-0.15 - o.arms[1].rotation.x) * 0.1;
      o.headPivot.rotation.y = Math.sin(t * 0.4) * 0.6;
      o.headPivot.rotation.x = -0.1;
    }
    // little hop when the agent receives a message
    if (o.kick > 0) { o.kick = Math.max(0, o.kick - dt * 1.6); }
    o.robot.position.y = Math.sin(t * 2 + k) * 0.02 + Math.sin(o.kick * Math.PI) * 0.35;
    // blink
    const blink = (t > o.blinkAt && t < o.blinkAt + 0.12) ? 0.15 : 1;
    if (t > o.blinkAt + 0.12) o.blinkAt = t + rand(2, 6);
    o.eyes.forEach(e => e.scale.y = blink);
    o.antenna.material.opacity = 0.6 + 0.4 * Math.sin(t * 3 + k);
    // rings
    const lvl = (w ? 0.6 : 0.3) + 0.15 * Math.sin(t * 2 + k) + o.selA * 0.5 + o.boost;
    o.outer.material.opacity = Math.min(lvl, 1.6);
    o.disc.material.opacity = 0.05 + o.selA * 0.08 + o.boost * 0.15;
    o.inner.rotation.z += dt * (0.4 + o.boost * 3);
    o.ring.scale.x = o.ring.scale.y = o.ring.scale.x > 0.999 && built ? 1 + o.boost * 0.08 + o.selA * 0.04 : o.ring.scale.x;
    o.screenLight.intensity = w ? 1.2 + Math.sin(t * 9 + k) * 0.2 : 0.4;
    // label position
    tmp.set(0, 2.6, -0.95); o.g.localToWorld(tmp); tmp.project(camera);
    const hw = (o.tag.offsetWidth || 80) / 2 + 8;
    const sx = Math.min(innerWidth - hw, Math.max(hw, (tmp.x * 0.5 + 0.5) * innerWidth)), sy = (-tmp.y * 0.5 + 0.5) * innerHeight;
    o.tag.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -100%)`;
    o.tag.style.opacity = built ? (focusIdx < 0 || focusIdx === k ? 1 : 0.35) : 0;
  }

  // core
  coreBall.scale.setScalar(1 + V.storm * 0.25 + Math.sin(t * 2) * 0.02);
  coreWire.rotation.y += dt * 0.2; coreWire.rotation.x += dt * 0.07;
  cloud.rotation.y += dt * (0.12 + V.storm * 1.2);
  cloud.scale.setScalar(1 + V.storm * 0.2);
  orbits.forEach(o => { o.rotation.x += o.userData.spin.x * dt * (1 + V.storm * 4); o.rotation.y += o.userData.spin.y * dt * (1 + V.storm * 4); });
  CORE.position.y = CORE_POS.y + Math.sin(t * 1.1) * 0.12;
  padRing.material.opacity = 0.6 + 0.3 * Math.sin(t * 2) + V.storm;
  if (built) coreLight.intensity = 10 + V.storm * 30 + Math.sin(t * 3) * 1.5;
  bloom.strength = 0.5 + V.storm * 0.35;

  // floor tiles flicker
  for (const tl of tiles) tl.material.opacity = Math.max(0, Math.sin(t * 0.8 + tl.userData.phase)) * 0.12 + V.storm * 0.1;

  // bursts
  for (let b = bursts.length - 1; b >= 0; b--) {
    const B = bursts[b]; B.life -= dt;
    const arr = B.pts.geometry.attributes.position.array;
    for (let k = 0; k < B.vel.length; k++) {
      const v = B.vel[k]; arr[k * 3] += v.x * dt; arr[k * 3 + 1] += v.y * dt; arr[k * 3 + 2] += v.z * dt; v.multiplyScalar(0.95); v.y -= dt * 0.6;
    }
    B.pts.geometry.attributes.position.needsUpdate = true;
    B.pts.material.opacity = Math.max(0, B.life / B.max);
    if (B.life <= 0) { scene.remove(B.pts); B.pts.geometry.dispose(); B.pts.material.dispose(); bursts.splice(b, 1); }
  }

  // camera shake on the world group
  world.position.set((Math.random() - 0.5) * V.shake * 0.25, (Math.random() - 0.5) * V.shake * 0.25, 0);

  controls.update();
  updateProjection();
  composer.render();
  requestAnimationFrame(frame);
}

refreshTeam();
runBuild();
setTimeout(taskTick, 3500);
frame();
</script>
